zql-exporter:
  zookeeper:
    host: 127.0.0.1
    port: 2182
    timeout:
      session: 10000
      connection: 10000
    ssl:
      enabled: true
      allow-insecure: false
      paths:
        ca: ./ca.crt
        private-key: ./certificate.key
        certificate: ./certificate.crt
  exporter:
    endpoints:
      query-as-table:
        enabled: true
      query-as-metrics:
        enabled: true
      queries:
        enabled: true
      metrics:
        enabled: true
    metrics:
      - query: "select path, data, 1 from /;"
        name: root

logging:
  level:
    root: info
    hyperpaint.zql: debug
    org.apache.zookeeper: warn
